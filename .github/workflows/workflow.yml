name: Service Build
permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: master-ci
  cancel-in-progress: true

jobs:
  treble:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Treble
        uses: actions/checkout@v4
        with:
          path: treble

      - name: Checkout Bass BFF SDK
        uses: actions/checkout@v4
        with:
          repository: Cooooing/Bass
          ref: sdk/bff_bbs/typescript-fetch
          path: Bass/common/proto/gen-sdk/typescript-fetch/bff_bbs

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: treble/pnpm-lock.yaml

      - name: Install and build Treble
        working-directory: treble
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Login (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./treble
          file: ./treble/Dockerfile
          push: true
          tags: |
            registry.cn-hangzhou.aliyuncs.com/docker-cooooing/treble:latest
            ghcr.io/cooooing/treble:latest
