name: Service Build
permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: treble-service-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Treble produces one SSR image, so a matrix would add scheduling overhead
  # without unlocking parallel work.
  treble:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Treble
        uses: actions/checkout@v5
        with:
          path: treble

      - name: Checkout Bass BFF SDK
        uses: actions/checkout@v5
        with:
          repository: Cooooing/Bass
          ref: sdk/bff_bbs/typescript-fetch
          path: Bass/common/proto/gen-sdk/typescript-fetch/bff_bbs

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: treble/pnpm-lock.yaml

      # Restores pnpm's download cache; the install remains deterministic.
      - name: Install dependencies
        working-directory: treble
        run: pnpm install --frozen-lockfile

      - name: Build Treble
        working-directory: treble
        run: pnpm build

      # The production dependency layer reaches the runtime image, so the
      # minimal cache remains useful without retaining discarded build layers.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Alibaba Cloud Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry token endpoints occasionally reset long-lived TLS connections.
      # Retrying the same content-addressed Buildx export is safe: both targets
      # receive the same immutable image layers and the same latest tag.
      - name: Build and publish image (attempt 1)
        id: publish_first
        uses: docker/build-push-action@v7
        continue-on-error: true
        with:
          context: ./treble
          file: ./treble/Dockerfile
          push: true
          # Alibaba Cloud Container Registry does not accept Buildx OCI attestations.
          provenance: false
          tags: |
            registry.cn-hangzhou.aliyuncs.com/docker-cooooing/treble:latest
            ghcr.io/cooooing/treble:latest
          cache-from: type=gha,scope=treble-image
          cache-to: type=gha,mode=min,scope=treble-image

      - name: Wait before image publication retry
        if: always() && steps.publish_first.outcome == 'failure'
        run: sleep 15

      - name: Build and publish image (attempt 2)
        id: publish_second
        if: always() && steps.publish_first.outcome == 'failure'
        uses: docker/build-push-action@v7
        continue-on-error: true
        with:
          context: ./treble
          file: ./treble/Dockerfile
          push: true
          provenance: false
          tags: |
            registry.cn-hangzhou.aliyuncs.com/docker-cooooing/treble:latest
            ghcr.io/cooooing/treble:latest
          cache-from: type=gha,scope=treble-image
          cache-to: type=gha,mode=min,scope=treble-image

      - name: Wait before final image publication retry
        if: always() && steps.publish_second.outcome == 'failure'
        run: sleep 30

      - name: Build and publish image (attempt 3)
        id: publish_third
        if: always() && steps.publish_second.outcome == 'failure'
        uses: docker/build-push-action@v7
        continue-on-error: true
        with:
          context: ./treble
          file: ./treble/Dockerfile
          push: true
          provenance: false
          tags: |
            registry.cn-hangzhou.aliyuncs.com/docker-cooooing/treble:latest
            ghcr.io/cooooing/treble:latest
          cache-from: type=gha,scope=treble-image
          cache-to: type=gha,mode=min,scope=treble-image

      - name: Verify image publication
        if: always()
        env:
          FIRST_ATTEMPT: ${{ steps.publish_first.outcome }}
          SECOND_ATTEMPT: ${{ steps.publish_second.outcome }}
          THIRD_ATTEMPT: ${{ steps.publish_third.outcome }}
        run: |
          if [[ "$FIRST_ATTEMPT" == "success" || "$SECOND_ATTEMPT" == "success" || "$THIRD_ATTEMPT" == "success" ]]; then
            exit 0
          fi
          echo "Image publication failed after three attempts." >&2
          exit 1
